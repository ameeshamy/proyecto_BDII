services:
  qdrant:
    image: qdrant/qdrant:v1.20.0   # misma version que qdrant-client
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

  chroma:
    image: chromadb/chroma:1.5.9   # misma version que chromadb-client
    ports:
      - "8001:8000"   # 8001 en la PC porque el 8000 lo usa otro proyecto
    volumes:
      - chroma_data:/data

  pgvector:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vectordb
    volumes:
      - pg_data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"   # visor web de PostgreSQL en http://localhost:8081
    environment:
      ADMINER_DEFAULT_SERVER: pgvector
    depends_on:
      - pgvector

volumes:
  qdrant_data:
  chroma_data:
  pg_data: